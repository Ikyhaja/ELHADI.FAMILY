<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ELHADI | LOGIN</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;900&display=swap');

        :root {
            --accent: #00ff88;
            --text: #ffffff;
            --bg-dark: #000000;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }

        body {
            height: 100vh;
            background: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.7)), 
                        url('hh.jpeg');
            background-position: center;
            background-size: cover;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text);
            overflow: hidden;
            text-align: center;
        }

        /* --- FITUR INTRO VIDEO SCREEN --- */
        #intro-video-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #000;
            z-index: 99999;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 1s cubic-bezier(0.23, 1, 0.32, 1), filter 1s;
        }

        #intro-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Tombol Lewati Video di pojok kanan bawah */
        .btn-skip-video {
            position: absolute;
            bottom: 30px;
            right: 30px;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(5px);
            color: rgba(255, 255, 255, 0.7);
            padding: 10px 25px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            border-radius: 4px;
            transition: 0.3s;
            z-index: 10;
            display: none; /* Muncul setelah overlay pembuka diklik */
        }

        .btn-skip-video:hover {
            border-color: var(--accent);
            color: var(--accent);
            background: rgba(0, 0, 0, 0.8);
        }

        /* --- OVERLAY UNTUK MENGAKTIFKAN SUARA (ANTI-BLOCK BROWSER) --- */
        #audio-unlocker {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            z-index: 20;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.5s;
        }

        .pulse-text {
            font-size: 0.9rem;
            letter-spacing: 6px;
            font-weight: 700;
            color: var(--accent);
            animation: textPulse 1.5s infinite ease-in-out;
            text-transform: uppercase;
        }

        @keyframes textPulse {
            0%, 100% { opacity: 0.4; transform: scale(0.98); }
            50% { opacity: 1; transform: scale(1); text-shadow: 0 0 15px rgba(0, 255, 136, 0.6); }
        }

        /* --- MAIN WRAPPER & ANIMATION --- */
        .main-wrapper {
            opacity: 0;
            filter: blur(20px);
            transform: scale(1.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 10;
            transition: opacity 2s cubic-bezier(0.23, 1, 0.32, 1), 
                        filter 2s cubic-bezier(0.23, 1, 0.32, 1),
                        transform 2s cubic-bezier(0.23, 1, 0.32, 1);
        }

        /* Class untuk memicu efek masuk halaman utama */
        .main-wrapper.show-content {
            filter: blur(0);
            opacity: 1;
            transform: scale(1);
        }

        .logo-main {
            font-size: clamp(3rem, 12vw, 6rem);
            font-weight: 900;
            letter-spacing: 15px;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .logo-main span { color: var(--accent); text-shadow: 0 0 20px rgba(0, 255, 136, 0.4); }

        .sub-tag {
            font-size: 0.8rem;
            letter-spacing: 5px;
            opacity: 0.6;
            text-transform: uppercase;
            margin-bottom: 80px;
            max-w: 600px;
            line-height: 1.6;
        }

        /* --- TOMBOL MULAI --- */
        .btn-start {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 20px 60px;
            font-size: 1rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 5px;
            cursor: pointer;
            transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }

        .btn-start:hover {
            border-color: var(--accent);
            color: var(--accent);
            box-shadow: 0 0 30px rgba(0, 255, 136, 0.2);
            letter-spacing: 8px;
        }

        .btn-start:active { transform: scale(0.95); }

        /* --- LOADING OVERLAY --- */
        #loading-screen {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-dark);
            z-index: 9999;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .spinner {
            width: 50px; height: 50px;
            border: 3px solid rgba(0, 255, 136, 0.1);
            border-top: 3px solid var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 25px;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        /* Fade Out Anim untuk Transisi Akhir */
        .fade-out {
            opacity: 0 !important;
            filter: blur(15px) !important;
            transform: scale(0.9) !important;
            transition: 0.8s;
        }
    </style>
</head>
<body>

    <!-- ================= 1. STRUKTUR INTRO VIDEO ================= -->
    <div id="intro-video-screen">
        <!-- Overlay awal agar interaksi klik memicu suara video -->
        <div id="audio-unlocker" onclick="putarDenganSuara()">
            <div class="pulse-text">Klik untuk Masuk & Putar Video</div>
        </div>

        <!-- Atribut 'muted' dihapus agar bisa mengeluarkan suara setelah di-trigger javascript -->
        <video id="intro-video" src="PixVerse_V6_Image_Text_540P_The_filming_employ.mp4" playsinline></video>
        <button class="btn-skip-video" id="skipBtn" onclick="akhiriIntroVideo()">Lewati Intro</button>
    </div>

    <!-- ================= 2. KONTEN UTAMA ================= -->
    <div class="main-wrapper" id="content">
        <div class="logo-main">ELH4D1<span>.FAMILY</span></div>
        <div class="sub-tag">Sebelum anda menjelajah lebih luas terhadap komunitas ini,
             anda diwajibkan untuk terhubung ke server</div>
        
        <button class="btn-start" onclick="triggerLoading()">Mulai</button>
        
        <p style="margin-top: 25px; font-size: 0.6rem; opacity: 0.3; letter-spacing: 2px;">
            KLIK UNTUK MENGHUBUNGKAN KE SERVER
        </p>
    </div>

    <!-- ================= 3. LOADING OVERLAY ================= -->
    <div id="loading-screen">
        <div class="spinner"></div>
        <div style="letter-spacing: 8px; font-size: 0.8rem; font-weight: 700; color: var(--accent);">
            SEDANG MENGAKSES SERVER...
        </div>
    </div>

    <!-- ================= 4. LOGIKA TRANSISI ================= -->
    <script>
        const videoScreen = document.getElementById('intro-video-screen');
        const videoElement = document.getElementById('intro-video');
        const mainContent = document.getElementById('content');
        const unlocker = document.getElementById('audio-unlocker');
        const skipBtn = document.getElementById('skipBtn');

        // Fungsi pemicu suara dan putar saat overlay diklik
        function putarDenganSuara() {
            unlocker.style.opacity = '0';
            setTimeout(() => {
                unlocker.remove();
                skipBtn.style.display = 'block'; // Tampilkan tombol lewati intro
            }, 500);

            videoElement.muted = false; // Buka suara video
            videoElement.volume = 1.0;  // Set volume maksimal
            videoElement.play().catch(error => {
                console.log("Playback gagal terpicu:", error);
            });
        }

        // Fungsi menghilangkan intro video dan memunculkan konten utama
        function akhiriIntroVideo() {
            videoScreen.style.opacity = '0';
            videoScreen.style.filter = 'blur(10px)';
            videoScreen.style.pointerEvents = 'none';

            setTimeout(() => {
                videoElement.pause();
                videoScreen.remove();
                mainContent.classList.add('show-content');
            }, 1000);
        }

        // OTOMATIS: Jika durasi video intro habis, masuk ke halaman utama tanpa diklik
        videoElement.addEventListener('ended', () => {
            akhiriIntroVideo();
        });

        // Logika transisi tombol 'Mulai' ke 'login.html'
        function triggerLoading() {
            mainContent.classList.add('fade-out');

            setTimeout(() => {
                document.getElementById('loading-screen').style.display = 'flex';
                
                setTimeout(() => {
                    window.location.href = "login.html"; 
                }, 2000);

            }, 600);
        }
    </script>
</body>
</html>
