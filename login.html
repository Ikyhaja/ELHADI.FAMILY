<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ELHADI | Login</title>
<style>
:root{--accent:#00ff88;--text:#fff;--error:#ff4d4d}
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,Arial,sans-serif}
body{height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(rgba(0,0,0,.5),rgba(0,0,0,.5)),url('hh.jpeg');background-size:cover;background-position:center;overflow:hidden}
#loader-overlay{display:none;position:fixed;inset:0;background:#000;z-index:9999;flex-direction:column;align-items:center;justify-content:center;color:var(--accent)}
.spinner{width:40px;height:40px;border:3px solid rgba(0,255,136,.1);border-top:3px solid var(--accent);border-radius:50%;animation:spin .8s linear infinite;margin-bottom:20px}
@keyframes spin{to{transform:rotate(360deg)}}
.login-card{position:relative;width:380px;padding:50px 40px;background:rgba(255,255,255,.05);backdrop-filter:blur(15px);border:1px solid rgba(255,255,255,.1);text-align:center;box-shadow:0 25px 50px rgba(0,0,0,.5)}
.login-card:before,.login-card:after{content:"";position:absolute;width:15px;height:15px;border:2px solid var(--accent)}
.login-card:before{top:0;left:0;border-right:none;border-bottom:none}.login-card:after{bottom:0;right:0;border-left:none;border-top:none}
.brand-name{font-size:1.8rem;font-weight:900;letter-spacing:5px;margin-bottom:5px}.brand-name span{color:var(--accent)}
.sub-text{font-size:.7rem;color:rgba(255,255,255,.4);letter-spacing:2px;text-transform:uppercase;margin-bottom:35px}
.input-box{margin-bottom:20px}.input-box input{width:100%;padding:14px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);outline:0;color:#fff}.input-box input:focus{border-color:var(--accent)}
.btn-login{width:100%;padding:15px;background:transparent;border:1px solid var(--accent);color:var(--accent);font-weight:700;text-transform:uppercase;letter-spacing:2px;cursor:pointer}.btn-login:hover{background:var(--accent);color:#000}.btn-login:disabled{opacity:.5}
#msg{font-size:.7rem;margin-bottom:10px;min-height:15px;text-transform:uppercase;font-weight:bold}
.links{margin-top:28px;font-size:.65rem;color:rgba(255,255,255,.35);line-height:2}.links a{color:var(--accent);text-decoration:none}
</style>
</head>
<body>
<div id="loader-overlay"><div class="spinner"></div><div style="letter-spacing:10px;font-size:.8rem;font-weight:700">INITIALIZING...</div></div>
<div class="login-card" id="card">
<div class="brand-name">ELH4D1<span>.FAMILY</span></div>
<div class="sub-text">Sistem Akses Regional</div>
<div id="msg"></div>
<form id="loginForm">
<div class="input-box"><input type="text" id="user" placeholder="ID PENGGUNA / EMAIL" required autocomplete="username"></div>
<div class="input-box"><input type="password" id="pass" placeholder="KATA SANDI" required autocomplete="current-password"></div>
<button type="submit" class="btn-login" id="loginBtn">Verifikasi Identitas</button>
</form>
<div class="links">Belum punya akun? <a href="register.html">BUAT AKUN</a><br><a href="register.html">Daftar sekarang</a></div>
</div>
<script src="api-config.js"></script>
<script>
const form=document.getElementById('loginForm'), msg=document.getElementById('msg'), btn=document.getElementById('loginBtn');
form.addEventListener('submit', async e=>{
 e.preventDefault(); btn.disabled=true; btn.textContent='MEMVERIFIKASI...';
 try{
  const r=await fetch(API_BASE_URL+'/login.php',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({
   username:document.getElementById('user').value.trim(),
   password:document.getElementById('pass').value
  })});
  const data=await r.json();
  if(!r.ok || !data.success) throw new Error(data.message||'Login gagal.');
  localStorage.setItem('elhadi_session',JSON.stringify(data.user));
  msg.style.color='var(--accent)'; msg.textContent='Kredensial Valid.';
  document.getElementById('loader-overlay').style.display='flex';
  setTimeout(()=>location.href='lobby.html',900);
 }catch(err){
  msg.style.color='var(--error)'; msg.textContent=err.message;
  document.getElementById('card').animate([{transform:'translateX(-7px)'},{transform:'translateX(7px)'},{transform:'translateX(0)'}],{duration:350});
  document.getElementById('pass').value='';
  btn.disabled=false; btn.textContent='Verifikasi Identitas';
 }
});
</script>
</body>
</html>
